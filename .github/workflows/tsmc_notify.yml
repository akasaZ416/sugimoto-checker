name: 8時30分 TSMCイベント通知

on:
  schedule:
    # 毎日8:30 JST (= 23:30 UTC 前日)
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  tsmc-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: TSMCイベント通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tsmc_notify.py
