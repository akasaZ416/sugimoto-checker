name: サイト更新チェック

on:
  schedule:
    # 毎日18:00 JST (= 09:00 UTC)
    - cron: '0 9 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4

      - name: 前回のハッシュを復元
        uses: actions/cache@v4
        with:
          path: last_hash.txt
          key: site-hash-${{ github.run_id }}
          restore-keys: |
            site-hash-

      - name: サイトを確認
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_updates.py
